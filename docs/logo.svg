<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Smotherfish logo">
  <title>Smotherfish</title>
  <rect width="128" height="128" rx="24" fill="#1d2433"/>
  <!-- fish body and tail -->
  <path d="M18 64 C 30 36, 70 30, 92 64 C 70 98, 30 92, 18 64 Z" fill="#e8ecf2"/>
  <path d="M90 64 L 114 44 L 108 64 L 114 84 Z" fill="#e8ecf2"/>
  <!-- a king boxed in by its own pieces: the smothered mate -->
  <g transform="translate(39 49)">
    <rect x="0"  y="0"  width="9" height="9" fill="#1d2433"/>
    <rect x="10" y="0"  width="9" height="9" fill="#1d2433"/>
    <rect x="20" y="0"  width="9" height="9" fill="#1d2433"/>
    <rect x="0"  y="10" width="9" height="9" fill="#1d2433"/>
    <rect x="10" y="10" width="9" height="9" fill="#d9534f"/>
    <rect x="20" y="10" width="9" height="9" fill="#1d2433"/>
    <rect x="0"  y="20" width="9" height="9" fill="#1d2433"/>
    <rect x="10" y="20" width="9" height="9" fill="#1d2433"/>
    <rect x="20" y="20" width="9" height="9" fill="#1d2433"/>
  </g>
  <circle cx="80" cy="58" r="3.5" fill="#1d2433"/>
</svg>
