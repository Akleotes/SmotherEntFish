<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Smotherfish logo">
  <title>Smotherfish</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26304a"/>
      <stop offset="1" stop-color="#161c2b"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f6fa"/>
      <stop offset="1" stop-color="#cfd6e3"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>

  <g transform="translate(64 66) scale(1.08) translate(-64 -64)">
  <!-- fish facing left: dorsal fin, forked tail, body -->
  <path d="M50 40 Q 60 25 76 41 Z" fill="#cfd6e3"/>
  <path d="M86 64 L 114 42 Q 106 64 114 86 Z" fill="#cfd6e3"/>
  <path d="M12 64 C 18 40, 58 30, 88 56 Q 92 64 88 72 C 58 98, 18 88, 12 64 Z" fill="url(#body)"/>

  <!-- head: gill line, eye with highlight, mouth -->
  <path d="M38 47 Q 31 64 38 81" fill="none" stroke="#9aa5ba" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="26" cy="58" r="4.5" fill="#161c2b"/>
  <circle cx="27.5" cy="56.5" r="1.4" fill="#ffffff"/>
  <path d="M13 66 L 19 66" stroke="#9aa5ba" stroke-width="2" stroke-linecap="round"/>

  <!-- the smothered king: a red king boxed in by its own pieces -->
  <g transform="translate(46 49)">
    <rect x="0"  y="0"  width="9" height="9" rx="1.5" fill="#26304a"/>
    <rect x="10.5" y="0"  width="9" height="9" rx="1.5" fill="#26304a"/>
    <rect x="21" y="0"  width="9" height="9" rx="1.5" fill="#26304a"/>
    <rect x="0"  y="10.5" width="9" height="9" rx="1.5" fill="#26304a"/>
    <rect x="10.5" y="10.5" width="9" height="9" rx="1.5" fill="#e0453f"/>
    <rect x="21" y="10.5" width="9" height="9" rx="1.5" fill="#26304a"/>
    <rect x="0"  y="21" width="9" height="9" rx="1.5" fill="#26304a"/>
    <rect x="10.5" y="21" width="9" height="9" rx="1.5" fill="#26304a"/>
    <rect x="21" y="21" width="9" height="9" rx="1.5" fill="#26304a"/>
  </g>
  </g>
</svg>
